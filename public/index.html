<!DOCTYPE html>
<html lang="pt-AO">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Fleves Music — descubra, ouça e descarregue músicas.">

    <meta name="theme-color" content="#07111f">

    <title>Fleves Music</title>

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- ÍCONES Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JAVASCRIPT -->
    <script src="app.js" defer></script>
</head>

<body>

    <!-- OVERLAY MOBILE -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- BOTÃO MENU MOBILE -->
    <button id="menuToggle" class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false"
        aria-controls="sidebar">
        <i class="bi bi-list"></i>
    </button>


    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div>

            <!-- LOGO -->
            <div class="logo">

                <div class="logo-icon">
                    <i class="bi bi-music-note-beamed"></i>
                </div>

                <div>
                    <h2>Fleves</h2>
                    <p>Music Streaming</p>
                </div>

            </div>


            <!-- NAVEGAÇÃO -->
            <nav aria-label="Navegação principal">

                <button type="button" class="nav-btn active" id="homeBtn">
                    <i class="bi bi-house-door-fill"></i>
                    <span>Início</span>
                </button>

                <button type="button" class="nav-btn" id="trendingBtn">
                    <i class="bi bi-fire"></i>
                    <span>Trending</span>
                </button>


                <button type="button" class="nav-btn" id="favoritosBtn">
                    <i class="bi bi-heart-fill"></i>
                    <span>Favoritos</span>
                </button>

            </nav>

        </div>

        <!-- FOOTER SIDEBAR -->
        <div class="sidebar-footer">
            <p>© 2026 Fleves Music</p>
            <p>Ouça. Descubra. Desfrute.</p>
        </div>

    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar" id="topbar">

            <div class="hero-text">

                <h1>
                    Descubra novas músicas
                    <i class="bi bi-headphones"></i>
                </h1>

                <p>
                    Streaming e downloads ilimitados
                </p>

            </div>


            <!-- BOTÃO PESQUISA MOBILE -->
            <button id="searchToggle" class="search-toggle" type="button" aria-label="Abrir pesquisa"
                aria-expanded="false">
                <i class="bi bi-search"></i>
            </button>


            <!-- PESQUISA -->
            <div id="searchContainer" class="search-container">

                <button id="closeSearch" class="close-search" type="button" aria-label="Fechar pesquisa">
                    <i class="bi bi-x-lg"></i>
                </button>


                <div class="search-box">

                    <input type="search" id="search" placeholder="Pesquisar músicas ou artistas..." autocomplete="off"
                        aria-label="Pesquisar músicas ou artistas">


                    <button id="searchButton" type="button">
                        <i class="bi bi-search"></i>
                        <span>Buscar</span>
                    </button>

                </div>

            </div>

        </header>

        <!-- RESULTADOS -->
        <section class="results-section" aria-labelledby="resultsTitle">

            <h2 id="resultsTitle" class="section-title">
                Resultados
            </h2>

            <div id="results" class="songs-grid"></div>

        </section>

    </main>

    <!-- PLAYER -->
    <footer class="player" id="player1" aria-label="Player de música">

        <!-- INFORMAÇÕES DA MÚSICA -->
        <div class="player-left">

            <div class="music-disc" id="musicDisc" aria-hidden="true"></div>

            <div class="music-info">

                <h3 id="now-playing">
                    Nenhuma música
                </h3>

                <p id="artist-playing">
                    Escolha uma música
                </p>

            </div>

        </div>

        <!-- ÁUDIO -->
        <audio id="player" controls preload="metadata">
            O teu navegador não suporta o elemento de áudio.
        </audio>

    </footer>

    <!-- CONTROLES DA INTERFACE -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            // ELEMENTOS
            const menuToggle = document.getElementById("menuToggle");

            const sidebar = document.getElementById("sidebar");

            const sidebarOverlay = document.getElementById("sidebarOverlay");

            const topbar = document.getElementById("topbar");

            const playerContainer = document.getElementById("player1");

            const audioPlayer = document.getElementById("player");

            const musicDisc = document.getElementById("musicDisc");

            const searchToggle = document.getElementById("searchToggle");

            const searchContainer = document.getElementById("searchContainer");

            const closeSearch = document.getElementById("closeSearch");

            const searchInput = document.getElementById("search");

            const searchButton = document.getElementById("searchButton");


            // SIDEBAR
            function openSidebar() {

                sidebar.classList.add("active");

                if (sidebarOverlay) {
                    sidebarOverlay.classList.add("active");
                }

                menuToggle.setAttribute("aria-expanded", "true");

                menuToggle.setAttribute("aria-label", "Fechar menu");

                menuToggle.innerHTML = '<i class="bi bi-x-lg"></i>';
            }

            function closeSidebar() {

                sidebar.classList.remove("active");

                if (sidebarOverlay) {
                    sidebarOverlay.classList.remove("active");
                }

                menuToggle.setAttribute("aria-expanded", "false");

                menuToggle.setAttribute("aria-label", "Abrir menu");

                menuToggle.innerHTML = '<i class="bi bi-list"></i>';
            }


            function toggleSidebar() {

                if (sidebar.classList.contains("active")) {
                    closeSidebar();
                } else {
                    openSidebar();
                }

            }

            menuToggle.addEventListener("click", toggleSidebar);

            if (sidebarOverlay) {

                sidebarOverlay.addEventListener("click", closeSidebar);

            }

            /* Fechar menu ao clicar num item */
            document.querySelectorAll(".nav-btn")
                .forEach(button => {

                    button.addEventListener("click", () => {

                            document.querySelectorAll(".nav-btn")
                                .forEach(btn => {
                                    btn.classList.remove("active");
                                });

                            button.classList.add("active");

                            if (window.innerWidth <= 900) {
                                closeSidebar();
                            }

                        });
                });

            // FECHAR SIDEBAR COM ESC
            document.addEventListener("keydown", event => {

                    if (event.key === "Escape" && sidebar.classList.contains("active")) {
                        closeSidebar();
                    }

                });

            // PLAYER
            function updatePlayerState() {

                if (!audioPlayer) {
                    return;
                }

                if (!audioPlayer.paused && !audioPlayer.ended) {

                    playerContainer.classList.add("is-playing");

                } else {

                    playerContainer.classList.remove("is-playing");

                }

            }

            if (audioPlayer) {

                audioPlayer.addEventListener("play", updatePlayerState);

                audioPlayer.addEventListener("pause", updatePlayerState);

                audioPlayer.addEventListener("ended", updatePlayerState);

            }

            // SCROLL
            let lastScroll = 0;

            let scrollTicking = false;

            function handleScroll() {

                const currentScroll = window.scrollY || window.pageYOffset;

                // Nunca esconder no topo
                if (currentScroll <= 50) {

                    topbar.classList.remove("hide");

                    playerContainer.classList.remove("hide");

                    lastScroll = currentScroll;

                    return;

                }

                // Descendo
                if (currentScroll > lastScroll && currentScroll > 100) {

                    topbar.classList.add("hide");

                    // No mobile mantemos o player. Ele é importante para controlar a música.
                    if (window.innerWidth > 768) {

                        playerContainer.classList.add("hide");

                    }

                }

                // Subindo
                else if (currentScroll < lastScroll) {

                    topbar.classList.remove("hide");

                    playerContainer.classList.remove("hide");

                }

                lastScroll = currentScroll;

                scrollTicking = false;

            }

            window.addEventListener("scroll", () => {

                    if (!scrollTicking) {

                        window.requestAnimationFrame(handleScroll);

                        scrollTicking = true;

                    }

                },
                {
                    passive: true
                }
            );


            // PESQUISA MOBILE
            function openSearch() {

                searchContainer.classList.add("active");

                searchToggle.setAttribute("aria-expanded", "true");

                document.body.style.overflow = "hidden";

                setTimeout(() => {

                    if (searchInput) {
                        searchInput.focus();
                    }

                }, 250);

            }

            function closeSearchPanel() {

                searchContainer.classList.remove("active");

                searchToggle.setAttribute("aria-expanded", "false");

                document.body.style.overflow = "";

            }

            searchToggle.addEventListener("click", openSearch);

            closeSearch.addEventListener("click", closeSearchPanel);

            // ESC fecha pesquisa

            document.addEventListener("keydown", event => {
                    if (event.key === "Escape" && searchContainer.classList.contains("active")) {
                        closeSearchPanel();
                    }

                });

            // PESQUISA COM ENTER
            if (searchInput) {

                searchInput.addEventListener("keydown", event => {

                        if (event.key === "Enter") {

                            event.preventDefault();

                            if (typeof window.searchMusic === "function") {
                                window.searchMusic();
                            }

                        }

                    });

            }

            // BOTÃO PESQUISAR
            if (searchButton) {

                searchButton.addEventListener("click", () => {

                        if (typeof window.searchMusic === "function") {
                            window.searchMusic();
                        }

                    });

            }

            // FECHAR PESQUISA AO CLICAR FORA SOMENTE MOBILE
            searchContainer.addEventListener("click", event => {

                    if (event.target === searchContainer && window.innerWidth <= 768) {
                        closeSearchPanel();
                    }

                });

            // RESPONSIVIDADE AO REDIMENSIONAR
            window.addEventListener("resize", () => {

                    if (window.innerWidth > 900) {
                        closeSidebar();
                    }

                    if (window.innerWidth > 768) {
                        closeSearchPanel();
                    }

                });

        });
    </script>

</body>

</html>
